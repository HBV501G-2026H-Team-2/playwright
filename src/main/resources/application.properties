spring.application.name=playwright

spting.api-docs.enabled=true
spting.swagger-ui.enabled=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.data.web.pageable.default-page-size=50
spring.data.web.pageable.max-page-size=500

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:h2:file:./data/pw
playwright.storage-root.path=./data/storage

springdoc.swagger-ui.csrf.enabled=true
